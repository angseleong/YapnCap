[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yapncap"
version = "0.1.0"
description = "A CLI tool that fact-checks YouTube videos, podcasts, and audio content in real-time."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Axeleon" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "youtube-transcript-api>=0.6.2",
    "yt-dlp>=2024.0.0",
    "google-genai>=0.1.0",
    "openai>=1.12.0",
    "groq>=0.4.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
yapncap = "yapncap.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["yapncap"]
